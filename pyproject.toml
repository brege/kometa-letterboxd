[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kometa-letterboxd"
version = "0.1"
description = "Generate Kometa collections from Letterboxd lists and Showdowns"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Wyatt Brege" },
]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0.2",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "plexapi>=4.17.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia",
]

[project.urls]
Repository = "https://github.com/brege/kometa-letterboxd"

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
]

[project.scripts]
kometa-letterboxd = "kometa_letterboxd.main:main"

[tool.hatch.build.targets.wheel]
packages = ["kometa_letterboxd"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
